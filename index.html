<!DOCTYPE html>
<html>
<head>
    <title>Empires Group Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 40px 20px; background-color: #f4f7f6; }
        .container { max-width: 450px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { padding: 12px; width: 100%; box-sizing: border-box; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 20px; font-size: 16px; }
        button { padding: 12px 24px; width: 100%; cursor: pointer; background: #5d5fef; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button.secondary { background: #6c757d; }
        #waiting-screen, #host-screen { display: none; }
        ul { list-style: none; padding: 0; text-align: left; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 5px; font-weight: bold; text-transform: capitalize; }
    </style>
</head>
<body>

    <div class="container">
        <div id="join-screen">
            <h1>Empires</h1>
            <p>Enter your secret identity:</p>
            <input type="text" id="identityInput" placeholder="e.g., Michael Jordan" autocomplete="off">
            <button onclick="submitName()">Submit Identity</button>
        </div>

        <div id="waiting-screen">
            <h2>✓ Identity Saved</h2>
            <p>Wait for the host to reveal the list.</p>
        </div>

        <div id="host-screen">
            <h1>Host Dashboard</h1>
            <p>Once everyone has joined, click below:</p>
            <button onclick="revealAndShuffle()">Reveal & Shuffle Names</button>
            <button class="secondary" onclick="clearGame()" style="margin-top: 30px;">Reset Game (Delete All)</button>
            <ul id="nameList"></ul>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAjNvk5FRx1t0-CNWINp9DrTU5AA7Bau_U",
            authDomain: "empires-group-game.firebaseapp.com",
            projectId: "empires-group-game",
            storageBucket: "empires-group-game.firebasestorage.app",
            messagingSenderId: "327538654623",
            appId: "1:327538654623:web:fa6f964973c6a252c191aa",
            databaseURL: "https://empires-group-game-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // CHECK IF HOST: Look for ?host=true in the URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('host') === 'true') {
            document.getElementById('join-screen').style.display = 'none';
            document.getElementById('host-screen').style.display = 'block';
        }

        function submitName() {
            const nameInput = document.getElementById('identityInput');
            const name = nameInput.value.trim();
            if (name !== "") {
                database.ref('identities').push(name);
                document.getElementById('join-screen').style.display = 'none';
                document.getElementById('waiting-screen').style.display = 'block';
            }
        }

        function revealAndShuffle() {
            database.ref('identities').once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return alert("No names in the bucket yet!");

                // Convert Firebase object to an Array
                let names = Object.values(data);

                // Fisher-Yates Shuffle Logic
                for (let i = names.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [names[i], names[j]] = [names[j], names[i]];
                }

                // Display names on screen
                const listUI = document.getElementById('nameList');
                listUI.innerHTML = ""; // Clear old list
                names.forEach(n => {
                    let li = document.createElement('li');
                    li.textContent = n;
                    listUI.appendChild(li);

                    // OPTIONAL: Read out loud
                    let utterance = new SpeechSynthesisUtterance(n);
                    window.speechSynthesis.speak(utterance);
                });
            });
        }

        function clearGame() {
            if (confirm("Delete all names and start over?")) {
                database.ref('identities').set(null);
                location.reload();
            }
        }
    </script>
</body>
</html>
